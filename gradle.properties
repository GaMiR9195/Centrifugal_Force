org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# Off on purpose. IntelliJ generates its own init script for the client/server run configs and
# that script calls Gradle.addListener and Task.project at execution time; the configuration
# cache forbids both, so the run dies before the game starts. Never shows up from the terminal,
# always shows up from the IDE. ACS disables it for exactly the same reason.
org.gradle.configuration-cache=false

mod_version=0.1.0

# 1.21.1
neoforge_version=21.1.228

# Sable / Sable Companion - compileOnly, the jars come from the run's mods folder.
# We touch two of Sable's mixinterface duck interfaces, and those are @ApiStatus.Internal,
# so the runtime range is pinned to the 2.0.x line exactly like Sure Footing pins its own.
sable_version=2.0.3
sable_companion_version=1.6.0
sable_version_range=[2.0.0,2.1)

# Aeronautics Camera Sync. 1.3.7 is the published API (addListener / addPolicy).
# addTiltSource() - the one the camera feature is built on - is on the api-beta line, newer
# than 1.3.7. See README: drop that jar into libs/ to compile the camera.
acs_version=1.3.7
acs_version_range=[1.3.7,)

# Sure Footing is a pure runtime companion. We never compile against it and never call into it.
surefooting_version_range=[1.2.0,)
