modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/GaMiR9195/Centrifugal_Force/issues"

[[mods]]
modId = "sable_cf"
# Expanded by processResources from gradle.properties, so the version lives in exactly one
# place. Bumping it in two files by hand is how a jar ends up lying about what it is.
version = "${mod_version}"
displayName = "Sable Centrifugal Force"
authors = "GaMiR9195"
# Must be a PNG (or another format Minecraft's texture loader accepts). WebP is not supported
# anywhere in the game's asset pipeline. Place the file at src/main/resources/icon.png - the
# path is relative to the resources root, not to META-INF.
logoFile = "icon.png"
description = '''
Rotating-frame physics for Sable sub-levels: centrifugal and Euler forces, deck-relative air
drag, foot friction with deliberate outward slip, a collision box that rotates with the body,
wall riding inside a spinning drum, and a camera that leans the way a person would rather than
locking to the deck plane.
'''

# One mixin config, two mixins. See sable_cf.mixins.json - EntityMixin only adds a field to
# Entity, and EntitySubLevelUtilMixin fills in a Sable hook that currently returns null.
# No refmap: NeoForge ships official mappings at runtime.
[[mixins]]
config = "sable_cf.mixins.json"

[[dependencies.sable_cf]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.sable_cf]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

# Hard requirement, and the version range is narrow on purpose: this mod reads Sable's
# internal movement interfaces and mixes into one of its API classes, so a minor bump
# is not automatically safe.
[[dependencies.sable_cf]]
modId = "sable"
type = "required"
versionRange = "[2.0.0,2.1)"
ordering = "AFTER"
side = "BOTH"

# Optional, and client-only: without it everything except the camera tilt still works.
# Needs a build with AcsHandle#addTiltSource, which as of 1.3.7 means the api-beta
# branch. The bridge degrades to a no-op rather than crashing if it is missing.
[[dependencies.sable_cf]]
modId = "aero_cam_sync"
type = "optional"
versionRange = "[1.3.7,)"
ordering = "AFTER"
side = "CLIENT"
