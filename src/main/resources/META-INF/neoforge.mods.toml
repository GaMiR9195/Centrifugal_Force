modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
logoBlur=false
authors="playsi"
description="Wall walking on Sable sub-levels: an oriented hitbox that keeps its feet on the surface, rolls between perpendicular planes in both directions and falls along its own local down axis."

[[mixins]]
config="centrifugal_force.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sable"
type="required"
versionRange="${sable_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="surefooting"
type="optional"
versionRange="[1.2.0,)"
ordering="AFTER"
side="BOTH"
