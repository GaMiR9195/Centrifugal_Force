org.gradle.jvmargs=-Xmx8G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=false
# Выключено намеренно. IntelliJ для запуска клиента/сервера генерирует свой init-скрипт
# (cpw_mods_bootstraplauncher_BootstrapLauncher_main__*.gradle), а тот зовёт Gradle.addListener
# и Task.project во время выполнения — кэш конфигурации запрещает оба, и ран падает ещё до
# старта игры. Из терминала (gradlew runClient) не всплывает, из IDEA — всегда.
org.gradle.configuration-cache=false


